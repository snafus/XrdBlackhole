name: CI

on:
  push:
    branches: [main, master, test-dev]
  pull_request:
  # Start a build by hand, on any branch, from the Actions page.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Test: build with ENABLE_TESTS=ON and run ctest.
  #
  # Matrix dimensions:
  #   os             — target distribution
  #   xrootd         — XRootD release line, used in the names of jobs and artifacts
  #   xrootd_version — what to install from the repo: an exact version
  #                    ("6.2.1") or a pattern ("5.*" is the latest 5.x)
  #
  # The plug-in libraries are named for the major version of the XRootD they
  # are built against (libXrdBlackhole-5.so, libXrdBlackhole-6.so), so each
  # release line gives its own packages.
  #
  # To build against another XRootD version, add entries below and in the rpm
  # job.  For a pre-release, set xrootd_repo_url to the testing repo.
  # ---------------------------------------------------------------------------
  test:
    name: Test / ${{ matrix.os }} / xrootd-${{ matrix.xrootd }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: rocky8
            image: rockylinux:8
            crb: powertools
            xrootd: '5'
            xrootd_version: '5.*'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky9
            image: rockylinux:9
            crb: crb
            xrootd: '5'
            xrootd_version: '5.*'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky8
            image: rockylinux:8
            crb: powertools
            xrootd: '6.2.1'
            xrootd_version: '6.2.1'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky9
            image: rockylinux:9
            crb: crb
            xrootd: '6.2.1'
            xrootd_version: '6.2.1'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          # Uncomment to test against the XRootD testing/pre-release channel:
          # - os: rocky9
          #   image: rockylinux:9
          #   crb: crb
          #   xrootd: testing
          #   xrootd_version: ''
          #   xrootd_repo_url: https://xrootd.web.cern.ch/xrootd-testing.repo

    steps:
      - name: Install git
        run: dnf -y install git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-build
        with:
          crb: ${{ matrix.crb }}
          xrootd_repo_url: ${{ matrix.xrootd_repo_url }}
          xrootd_version: ${{ matrix.xrootd_version }}

      # Cache the GoogleTest FetchContent download (v1.14.0, keyed per OS).
      # CMake skips the fetch when build/_deps is already populated.
      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-v1.14.0-${{ matrix.os }}

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure -j$(nproc)

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.os }}-xrootd-${{ matrix.xrootd }}
          path: build/**/*.so
          retention-days: 7

  # ---------------------------------------------------------------------------
  # RPM: build binary RPMs from a source RPM, for each XRootD release line.
  # The packages for XRootD 5 and for XRootD 6 have the same file names; the
  # artifact name says which they are, and each package requires the XRootD
  # major version it was built against.
  # Runs after all test matrix entries pass.
  # ---------------------------------------------------------------------------
  rpm:
    name: RPM / ${{ matrix.os }} / xrootd-${{ matrix.xrootd }}
    runs-on: ubuntu-latest
    needs: [test]
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: rocky8
            image: rockylinux:8
            crb: powertools
            xrootd: '5'
            xrootd_version: '5.*'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky9
            image: rockylinux:9
            crb: crb
            xrootd: '5'
            xrootd_version: '5.*'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky8
            image: rockylinux:8
            crb: powertools
            xrootd: '6.2.1'
            xrootd_version: '6.2.1'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo
          - os: rocky9
            image: rockylinux:9
            crb: crb
            xrootd: '6.2.1'
            xrootd_version: '6.2.1'
            xrootd_repo_url: https://xrootd.web.cern.ch/xrootd.repo

    steps:
      - name: Install git
        run: dnf -y install git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-build
        with:
          crb: ${{ matrix.crb }}
          xrootd_repo_url: ${{ matrix.xrootd_repo_url }}
          xrootd_version: ${{ matrix.xrootd_version }}
          rpm_tools: 'true'

      - name: Set up RPM tree
        run: rpmdev-setuptree

      - name: Build SRPM
        run: |
          mkdir -p /tmp/srpms
          cd packaging
          bash makesrpm.sh --source ../ --output /tmp/srpms

      - name: Install binary RPM build dependencies
        run: dnf builddep -y /tmp/srpms/xrootd-blackhole-*.src.rpm

      - name: Build binary RPMs
        run: rpmbuild --rebuild /tmp/srpms/xrootd-blackhole-*.src.rpm

      - name: Collect RPMs
        run: |
          mkdir -p /tmp/rpms
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' | sort | tee /tmp/rpms-list.txt
          xargs -a /tmp/rpms-list.txt cp -t /tmp/rpms/

      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.os }}-xrootd-${{ matrix.xrootd }}
          path: /tmp/rpms/*.rpm
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 30 }}
