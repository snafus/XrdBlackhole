name: 'Setup build environment'
description: >
  Configure git safe.directory, install compiler toolchain and XRootD
  development headers.  Must be called after actions/checkout.

inputs:
  crb:
    description: 'CRB repo name: "powertools" (el8) or "crb" (el9)'
    required: true
  xrootd_repo_url:
    description: 'URL of the XRootD yum .repo file to install'
    required: false
    default: 'https://xrootd.web.cern.ch/xrootd.repo'
  xrootd_version:
    description: >
      XRootD version to install from the repo, for example "6.2.1" or "5.*".
      Empty (the default) installs the latest version the repo offers.
    required: false
    default: ''
  rpm_tools:
    description: 'Set to "true" to also install rpm-build and rpmdevtools'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Mark workspace as git safe directory
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install build dependencies
      shell: bash
      run: |
        dnf -y install dnf-plugins-core epel-release
        dnf config-manager --set-enabled ${{ inputs.crb }}
        dnf -y install \
          gcc gcc-c++ make cmake git which \
          openssl-devel zlib-devel curl-devel libuuid-devel
        curl -sSL '${{ inputs.xrootd_repo_url }}' \
          -o /etc/yum.repos.d/xrootd.repo
        # The XRootD packages require each other at the same version, so
        # naming the version on these four fixes it for all of them.
        version='${{ inputs.xrootd_version }}'
        suffix=${version:+-$version}
        dnf -y install \
          "xrootd-server-devel$suffix" \
          "xrootd-private-devel$suffix" \
          "xrootd-client-devel$suffix" \
          "xrootd-libs$suffix"
        # Keep that version: a later "dnf builddep" would otherwise replace
        # it with the latest one the repo offers.
        if [[ -n "$version" ]]; then
          dnf -y install 'dnf-command(versionlock)'
          dnf versionlock add 'xrootd*'
        fi
        rpm -q xrootd-server-devel

    - name: Install RPM packaging tools
      if: inputs.rpm_tools == 'true'
      shell: bash
      run: dnf -y install rpm-build rpmdevtools
